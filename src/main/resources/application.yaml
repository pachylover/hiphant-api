server:
  port: 8080
  error:
    # 에러 발생 시 메시지를 포함하지 않음
    include-message: never
    # 스택트레이스(에러 경로)를 절대 노출하지 않음
    include-stacktrace: never
    # 에러 발생 시 바인딩 오류(파라미터 등) 노출 방지
    include-binding-errors: never
    # 에러 페이지 자체를 화이트라벨(기본) 페이지로 유지하거나 끔
    whitelabel:
      enabled: false
spring:
  application:
    name: highlight
  datasource:
    # Render 환경변수에서 값을 가져오고, 없으면 로컬 DB 주소를 씁니다.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/highlight}
    username: ${SPRING_DATASOURCE_USERNAME:highlight}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
        # JDBC / Hibernate batching for bulk inserts
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true
        # 세션마다 15줄짜리 Session Metrics 를 찍어 로그를 뒤덮는다. 필요할 때만 켠다.
        generate_statistics: ${HIBERNATE_STATISTICS:false}
        # reduce session memory pressure when inserting large volumes
        default_batch_fetch_size: 50
            
  flyway:
    enabled: true
    # 기존 데이터가 있는 상태에서 Flyway를 처음 적용할 때 필요합니다.
    baseline-on-migrate: true
    # 배포 환경에서 마이그레이션 위치 확인
    locations: classpath:db/migration

  docker:
    compose:
      enabled: false

chzzk:
  base-url: https://api.chzzk.naver.com
  max-in-memory-size: 10485760 # 10MB
  # 응답이 오지 않는 요청에 수집 스레드가 묶이지 않도록 상한을 둔다.
  connect-timeout-ms: ${CHZZK_CONNECT_TIMEOUT_MS:10000}
  # 차단당하면 응답이 아예 오지 않는다. 20초를 기다릴 이유가 없어 10초로 줄였다.
  response-timeout-ms: ${CHZZK_RESPONSE_TIMEOUT_MS:10000}
  # 누가 보내는 요청인지 밝힌다. 익명 클라이언트는 차단 대상이 되기 쉽다.
  user-agent: ${CHZZK_USER_AGENT:HiPhant/1.0 (+https://hiphant.pachylover.com)}
  # 페이지 사이 간격(ms). 간격 없이 연속으로 쏘면 봇으로 판정될 수 있다.
  # 한 요청이 채팅 200개를 주므로 채팅 1만 개 기준 약 50회 요청 = 10초 추가 정도다.
  page-delay-ms: ${CHZZK_PAGE_DELAY_MS:300}
  # 응답이 끊긴 뒤의 대기 시간. 기존 백오프는 1초라 곧바로 다시 두들겨 또 막혔다.
  stall-cooldown-ms: ${CHZZK_STALL_COOLDOWN_MS:15000}

gemini:
  # Render 환경변수에 GEMINI_API_KEY를 꼭 추가하세요!
  api-key: ${GEMINI_API_KEY:1234}

admin:
  # 관리자 JWT 설정 (운영에서는 반드시 ADMIN_JWT_SECRET 환경변수로 32바이트 이상 랜덤값 지정)
  jwt:
    secret: ${ADMIN_JWT_SECRET:change-me-please-use-a-long-random-secret-key-32bytes+}
    expiration-ms: ${ADMIN_JWT_EXPIRATION_MS:43200000} # 12시간
  # 최초 관리자 계정 부트스트랩 (없을 때만 생성). ADMIN_USERNAME/ADMIN_PASSWORD 환경변수 사용
  bootstrap:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        # health: 헬스체크/업타임 모니터링, info: 배포된 빌드 확인용
        include: health,info
  info:
    build:
      enabled: true
    env:
      # 환경변수가 통째로 노출되지 않도록 명시적으로 끈다
      enabled: false

logging:
  level:
    root: INFO
  # 파일 로깅은 LOGGING_FILE_NAME 환경변수를 준 곳에서만 켜진다(운영 compose).
  # 여기서 경로를 지정하지 않으므로 로컬 개발은 콘솔 출력 그대로다.
  # 아래 정책은 파일 로깅이 켜졌을 때만 의미가 있다.
  logback:
    rollingpolicy:
      # 10MB 마다 하루 단위로 말아 두고, 14일 / 총 500MB 를 넘지 않게 유지한다
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 500MB

# Exact CDN hostname verified with public VOD playback; no wildcard hosts.
clip:
  media:
    allowed-hosts: ${CLIP_MEDIA_ALLOWED_HOSTS:ex-nlive-slitvod-streaming.navercdn.com,b01-kr-naver-vod.pstatic.net}
